# Simulation Configuration — RadQueue AI
# Owner: P1 (Data & Config Lead), consumed by P4 (Simulation Engineer)
# Reference: MASTER_PROMPT §6.1, §6.2, §8.1

random_seed: 42

# ── Simulation Duration ──

simulation:
  days: 180             # 6 months of operations
  warmup_days: 7        # discard first week for warm-up
  runs_per_policy: 3    # repeat each policy N times for statistical confidence

# ── Department Operating Hours ──

operating_hours:
  open_hour: 8    # 8 AM
  close_hour: 20  # 8 PM
  emergency_24x7: false  # emergencies only during operating hours for simplicity

# ── Arrival Rate Configuration (§6.1, §8.1) ──
# Time-varying Poisson process: lambda(t) varies by hour

arrival_rates:
  # Hourly multipliers for arrival intensity (base = daily_patient_volume / operating_hours)
  hourly_multipliers:
    8: 0.8    # opening — ramp up
    9: 1.5    # peak morning
    10: 1.6   # peak morning
    11: 1.3   # tapering
    12: 0.7   # lunch dip
    13: 0.8   # post-lunch
    14: 1.4   # peak afternoon
    15: 1.3   # peak afternoon
    16: 1.0   # tapering
    17: 0.8   # winding down
    18: 0.5   # late afternoon
    19: 0.3   # closing hours

  # Visit type proportions (must sum to 1.0 per tier — configured in hospital_profiles.yaml)
  # walk_in_ratio comes from hospital profile
  # emergency_ratio comes from hospital profile
  # scheduled = 1.0 - walk_in_ratio - emergency_ratio (approximately)

# ── Service Time Distributions (§8.1) ──
# Log-normal parameters: median ≈ exp(mu), spread controlled by sigma

service_times:
  xray:
    distribution: "lognormal"
    mu: 1.6
    sigma: 0.35
    median_minutes: 6.0
    min_minutes: 2.0
    max_minutes: 20.0

  ct:
    distribution: "lognormal"
    mu: 3.0
    sigma: 0.4
    median_minutes: 23.0
    min_minutes: 10.0
    max_minutes: 60.0

  mri:
    distribution: "lognormal"
    mu: 3.7
    sigma: 0.35
    median_minutes: 45.0
    min_minutes: 20.0
    max_minutes: 120.0

  ultrasound:
    distribution: "lognormal"
    mu: 1.8
    sigma: 0.4
    median_minutes: 7.0
    min_minutes: 3.0
    max_minutes: 25.0

# ── Ancillary Process Times (§6.1) ──

process_times:
  registration:
    mean_minutes: 5.0
    std_minutes: 2.0
    min_minutes: 1.0

  technologist_prep:
    mean_minutes: 4.0
    std_minutes: 2.0
    min_minutes: 1.0

  radiologist_reporting:
    mean_minutes: 12.0
    std_minutes: 5.0
    min_minutes: 3.0

# ── Patient Characteristics Distributions ──

patient_distributions:
  age_group_weights:
    "0-18": 0.10
    "18-40": 0.35
    "40-60": 0.30
    "60+": 0.25

  gender_weights:
    "M": 0.52
    "F": 0.48

  insurance_weights:
    government: 0.45
    private: 0.35
    self_pay: 0.20

  exam_complexity_weights:
    simple: 0.50
    moderate: 0.35
    complex: 0.15

  distance_category_weights:
    local: 0.60
    city: 0.30
    outstation: 0.10

  contrast_probability:
    ct: 0.40
    mri: 0.35
    xray: 0.0
    ultrasound: 0.0

  prep_probability:
    ultrasound: 0.30
    mri: 0.20
    ct: 0.10
    xray: 0.0

# ── No-Show Modeling ──

noshow:
  base_rate: 0.20
  # Multipliers on base rate
  lead_time_effect:
    0: 0.0     # walk-in — can't no-show
    1: 0.5     # next day — low no-show
    2: 0.7
    3: 1.0
    7: 1.3     # week out
    14: 1.5    # two weeks out
    30: 2.0    # month out — highest no-show risk
  monsoon_multiplier: 1.2
  monday_multiplier: 0.9  # Mondays are high-demand, people actually show up

# ── What-If Scenario Presets (§8.1) ──

whatif_scenarios:
  - name: "add_1_mri"
    description: "Add 1 MRI machine"
    machine_adjustments:
      mri: 1

  - name: "add_2_technologists"
    description: "Add 2 technologists"
    staff_adjustments:
      technologists: 2

  - name: "increase_emergency_buffer"
    description: "Increase emergency buffer from 10% to 20%"
    emergency_buffer_fraction: 0.20

  - name: "high_volume_day"
    description: "1.5x normal patient volume"
    arrival_rate_multiplier: 1.5

  - name: "reduce_noshow"
    description: "SMS reminders reduce no-show by 40%"
    noshow_rate_multiplier: 0.60
