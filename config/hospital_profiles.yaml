# Hospital Profile Configurations — RadQueue AI
# Owner: P1 (Data & Config Lead)
# Reference: MASTER_PROMPT §6.3

# Tier 1: Government Teaching Hospital (high volume, 250+ patients/day)
tier_1:
  name: "Government Teaching Hospital"
  tier: "tier_1"
  daily_patient_volume: 200  # midpoint of 150-250
  walk_in_ratio: 0.70
  emergency_ratio: 0.10
  noshow_rate: 0.20

  resources:
    xray_rooms: 3
    ct_scanners: 2
    mri_machines: 1
    us_rooms: 2
    registration_desks: 2

  staff:
    technologists: 8
    radiologists: 4

  shifts:
    morning:
      start_hour: 8
      end_hour: 14
      technologists: 8
      radiologists: 4
    afternoon:
      start_hour: 14
      end_hour: 20
      technologists: 6
      radiologists: 3
    evening:
      start_hour: 20
      end_hour: 23
      technologists: 3
      radiologists: 1

